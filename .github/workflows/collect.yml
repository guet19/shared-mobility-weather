# Collects a snapshot of all shared vehicles in Switzerland every 10 minutes.
#
# GitHub's scheduler is unreliable for short intervals (a */10 cron ran only
# every 4-5 hours in practice). Therefore one job runs for ~5.5 hours and
# collects every 10 minutes itself (collector/loop.sh). At the end, each job
# starts the next one itself; the hourly cron is only a backup. While a job is
# running, a newly started one waits in the concurrency queue.
name: collect-shared-mobility

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # commit the collected data
  actions: write    # start the next job (workflow_dispatch)

concurrency:
  group: collector          # never two jobs at the same time (state!)
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collector.txt

      - run: pip install -r requirements-collector.txt

      # State (= last snapshot + vehicles currently on a trip) lives in the
      # Actions cache, not in git, to keep the repository small.
      - name: Restore collector state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: collector-state-${{ github.run_id }}
          restore-keys: collector-state-

      - name: Collect every 10 minutes for ~5.5 hours
        run: bash collector/loop.sh

      - name: Save collector state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: collector-state-${{ github.run_id }}

      # GitHub's scheduler skipped the hourly cron for hours, so every job
      # starts its successor itself (workflow_dispatch is allowed with the
      # GITHUB_TOKEN). The cron above stays as a backup; the concurrency group
      # makes sure that only one job runs and at most one waits.
      - name: Start next collection job
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref main -R "${{ github.repository }}"
