# Collects a snapshot of all shared vehicles in Switzerland every ~10 minutes
# and commits the new (small) data files to the repository.
# Note: GitHub may delay scheduled runs by several minutes under load;
# timestamps are stored per snapshot, so irregular intervals are fine.
name: collect-shared-mobility

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collector          # never two runs at the same time (state!)
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collector.txt

      - run: pip install -r requirements-collector.txt

      # State (= last snapshot + vehicles currently on a trip) lives in the
      # Actions cache, not in git, to keep the repository small.
      - name: Restore collector state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: collector-state-${{ github.run_id }}
          restore-keys: collector-state-

      - name: Collect snapshot
        run: python collector/collect.py

      - name: Save collector state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: collector-state-${{ github.run_id }}

      - name: Commit new data
        run: |
          git config user.name  "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet && exit 0
          git commit -q -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1
